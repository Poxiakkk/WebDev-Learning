<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Validation</title>
    <meta name="copyright" content="Poxiakkk">

    <style>
        body {
            font-family: comic-sans, sans-serif;
            background-color: #636363;
            height: 100vh;
            margin: 0;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            justify-content: center;
            gap: 24px;
        }
        .card{
            background-color: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
        }
        .hidden{
            display: none;
        }
        input[type="number"],
        input[type="submit"],
        button{
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        input[type="submit"] {
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        input[type="submit"]:hover{
            background-color: #e0e0e0
        }
        .card{
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            width: 100%;
        }
        .checkbox-item {
            display: flex;
            align-items:center;
            gap: 8px;
            cursor: pointer;
        }
        input[type="checkbox"]{
            width: 18px;
            height: 18px;
            accent-color: #007BFF;
        }
        #passwordOutput {
            overflow-warp: break-word;
            word-break: break-all;
            max-width: 100%;
        }
    </style>
</head>
<body>

    <h1>Password Generator</h1>
<div class="card">

<form id="form"> 
    <label for="passwordLength">Password Length: <span id="lengthValue">50</span></label> <br>
    <input type="range" min="1" max="100" value="50" value="Dlugosc hasla" id="passwordLength" placeholder="Password Length" step="1"/><br>
    <label class="checkbox-label checkbox-item">
        <input type="checkbox" id="uppercaseCheckbox" />Uppercase Letters
    </label>
    <label class="checkbox-label checkbox-item">
        <input type="checkbox" id="lowercaseCheckbox" />Lowercase Letters
    </label>
    <label class="checkbox-label checkbox-item">
        <input type="checkbox" id="numbersCheckbox" />0-9
    </label>
    <label class="checkbox-label checkbox-item">
        <input type="checkbox" id="specialCharsCheckbox" />Special Characters
    </label>
    <input type="submit" value="generate" id="submitButton" />

</form>
<div class="hidden" id="show">
    <h2>Generated Password:</h2>
<p id="passwordOutput"></p>
<button id="back">Back</button>
</div>
</div>
<script src="script.js"></script>
</body>
